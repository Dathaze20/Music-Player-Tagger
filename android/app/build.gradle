apply plugin: 'com.android.application'

// Release signing is configured entirely from the environment. Nothing secret is
// stored in this repository.
def releaseKeystorePath  = System.getenv('KEYSTORE_PATH')
def releaseStorePassword = System.getenv('STORE_PASSWORD')
def releaseKeyAlias      = System.getenv('KEY_ALIAS')
def releaseKeyPassword   = System.getenv('KEY_PASSWORD')
def hasReleaseKey = releaseKeystorePath?.trim() &&
                    releaseStorePassword?.trim() &&
                    releaseKeyAlias?.trim() &&
                    releaseKeyPassword?.trim() &&
                    file(releaseKeystorePath).exists()

if (!hasReleaseKey) {
    logger.lifecycle('No signing key in the environment — release will be unsigned, debug uses the debug key.')
}

// A tagged release supplies its version; everyday builds keep the defaults.
// Android decides whether an install is an upgrade by versionCode alone, so this
// has to advance between releases or a newer APK will not install over an older one.
def appVersionName = System.getenv('APP_VERSION_NAME') ?: '1.1'
def appVersionCode = (System.getenv('APP_VERSION_CODE') ?: '2') as int

android {
    namespace = "com.muzioai.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.muzioai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signing material comes from the environment, never from the repository.
    // CI populates these from GitHub Secrets; for a local release build, export
    // them in your shell first. When they are absent the release build is left
    // unsigned and debug falls back to the standard debug key, so a plain
    // `assembleDebug` still works for anyone who clones this.
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKey) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Signing debug with the release key keeps the same package identity, so
            // a debug APK installs over an existing install without uninstalling.
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'net.jthink:jaudiotagger:3.0.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
