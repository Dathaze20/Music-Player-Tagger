name: Publish Release

# Push a tag like v1.2.0 and this builds the signed app and publishes a GitHub
# Release with the APK attached. Unlike Actions artifacts, a release does not
# expire and anyone can download it without a GitHub account.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Tags and history, so notes can fall back to the commits since the
          # previous release when CHANGELOG.md has no section for this one.
          fetch-depth: 0

      - name: Work out the version
        id: ver
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          NAME="${RAW#v}"
          if ! echo "$NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like v1.2.0 (got '$RAW')."
            exit 1
          fi
          # Pack major.minor.patch into a single ascending integer for Android.
          MAJOR=$(echo "$NAME" | cut -d. -f1)
          MINOR=$(echo "$NAME" | cut -d. -f2)
          PATCH=$(echo "$NAME" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          {
            echo "tag=v$NAME"
            echo "name=$NAME"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$NAME (versionCode $CODE)"

      - name: Set up JDK 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Patch @capacitor/filesystem kotlin extension collision
        run: |
          FILE="node_modules/@capacitor/filesystem/android/build.gradle"
          sed -i "s/apply plugin: 'kotlin-android'/if (project.extensions.findByName('kotlin') == null) { apply plugin: 'kotlin-android' }/" "$FILE"

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/. android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          echo '{"plugins":{}}' > android/app/src/main/assets/capacitor.plugins.json
          mkdir -p android/app/src/main/res/xml
          printf "<?xml version='1.0' encoding='utf-8'?>\n<widget version=\"1.0.0\" xmlns=\"http://www.w3.org/ns/widgets\" xmlns:cdv=\"http://cordova.apache.org/ns/1.0\">\n  <access origin=\"*\" />\n</widget>\n" > android/app/src/main/res/xml/config.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install Android SDK 36
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      # A release must be signed. Unlike the normal build this fails outright
      # rather than quietly producing an unsigned file nobody can install.
      - name: Decrypt release keystore
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::error::KEYSTORE_PASSPHRASE is not set. A release cannot be published unsigned."
            exit 1
          fi
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                 -in android/app/keystore.jks.enc \
                 -out "$RUNNER_TEMP/release.jks" \
                 -pass pass:"$KEYSTORE_PASSPHRASE" 2>/dev/null; then
            echo "::error::Could not decrypt the keystore. KEYSTORE_PASSPHRASE is wrong."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEYSTORE_PASSPHRASE" -alias mymusic > /dev/null 2>&1; then
            echo "::error::Keystore decrypted but would not open."
            exit 1
          fi
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEY_ALIAS=mymusic"
            echo "STORE_PASSWORD<<__EOF__"; echo "$KEYSTORE_PASSPHRASE"; echo "__EOF__"
            echo "KEY_PASSWORD<<__EOF__";   echo "$KEYSTORE_PASSPHRASE"; echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -o pipefail
          cd android && ./gradlew assembleRelease bundleRelease --no-daemon

      # Refuse to publish anything that did not actually get signed.
      - name: Confirm the APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK was produced."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -20
          mkdir -p dist
          cp "$APK" "dist/MyMusic-${{ steps.ver.outputs.tag }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/MyMusic-${{ steps.ver.outputs.tag }}.aab"
          ls -lh dist

      # Auto-generated notes list every pull request in the project's history,
      # which pushes the Assets section far below the fold — on the GitHub mobile
      # app the download looks missing entirely. Short notes keep it reachable.
      #
      # What changed comes from CHANGELOG.md rather than being written here, so
      # the notes describe the version being built. They used to be fixed text
      # in this file, which meant every release repeated the same list however
      # much had changed since.
      - name: Write the release notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cat > dist/NOTES.md <<NOTES
          A local music player for Android that tags your library for you.

          ## Install

          Download **MyMusic-$TAG.apk** below and open it.

          Android will warn that your browser is not allowed to install apps —
          tap Settings, turn on "Allow from this source", go back, and tap
          Install. That prompt appears for any app not from the Play Store.

          On first launch, allow access to your music files.

          Already have it installed? This installs straight over the top; nothing
          is lost.

          ## In this version
          NOTES

          # The section for this tag, up to the next heading.
          awk -v tag="## $TAG" '
            $0 == tag { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > dist/section.md

          if [ -s dist/section.md ]; then
            cat dist/section.md >> dist/NOTES.md
          else
            # No section written for this version. Say so plainly and list the
            # commits, rather than repeating another release's notes as if they
            # described this one.
            echo "::warning::No CHANGELOG.md section for $TAG; falling back to commit subjects."
            PREV=$(git describe --tags --abbrev=0 --exclude="$TAG" 2>/dev/null || true)
            {
              echo ""
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "$PREV"..HEAD | head -20
              else
                git log --no-merges --pretty='- %s' -10
              fi
            } >> dist/NOTES.md
          fi

          printf '\nRequires Android 7.0 or newer. iPhone is not supported.\n' >> dist/NOTES.md
          echo "--- notes ---"
          cat dist/NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Re-runnable: update the release if the tag already has one.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "My Music $TAG" --notes-file dist/NOTES.md
            gh release upload "$TAG" \
              "dist/MyMusic-$TAG.apk" "dist/MyMusic-$TAG.aab" --clobber
          else
            gh release create "$TAG" \
              "dist/MyMusic-$TAG.apk" "dist/MyMusic-$TAG.aab" \
              --title "My Music $TAG" --notes-file dist/NOTES.md
          fi
